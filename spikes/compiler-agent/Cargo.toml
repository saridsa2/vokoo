[package]
name = "vokoo-compiler-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aisdk = { path = "../../bridge/vendor/aisdk", default-features = false, features = ["language-model-request", "anthropic"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
