; Asterisk's HTTP server — ARI's transport, and nothing else.
;
; Bound to loopback. ARI can originate calls, bridge channels and hang people
; up; it is the most dangerous surface Asterisk has, and the only thing that
; needs it is the bridge on this same box.
[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
