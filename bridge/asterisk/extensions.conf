; Sarvathra — where an arriving call goes.
;
; Deployed to /etc/asterisk/extensions.conf.

[globals]
; The bridge, on loopback. AudioSocket carries unencrypted PCM, which is the
; whole reason Asterisk is on this box rather than the helix one: this hop never
; touches a network.
BRIDGE_HTTP = http://127.0.0.1:8080
BRIDGE_AUDIOSOCKET = 127.0.0.1:9092

; ---- WhatsApp -----------------------------------------------------------
;
; Meta puts the caller in From and our business number in To, so ${EXTEN} is the
; number that was called — which is what resolves a flow, exactly as a DID does
; for a PSTN call.
[from-whatsapp]
exten => _[+0-9].,1,NoOp(WhatsApp call to ${EXTEN} from ${CALLERID(num)})
    ; AudioSocket identifies a connection by a uuid and nothing else, so the
    ; bridge is told what this one is *before* the socket opens. Without it the
    ; bridge would have a stream of PCM and no idea which flow it belongs to.
    same => n,Set(WA_UUID=${UUID()})
    same => n,Set(WA_CID=${PJSIP_HEADER(read,x-wa-meta-wacid)})
    same => n,Answer()
    ; A POST rather than a query string: the caller's number is personal data
    ; and a URL is the one part of an HTTP request that gets logged everywhere.
    same => n,Set(TOLD=${CURL(${BRIDGE_HTTP}/asterisk/incoming,uuid=${WA_UUID}&to=${EXTEN}&from=${CALLERID(num)}&channel=whatsapp&wacid=${WA_CID})})
    same => n,NoOp(bridge said: ${TOLD})
    ; If the bridge did not accept the call there is nothing to connect to, and
    ; a silent AudioSocket is worse than a clean hangup — the caller at least
    ; knows to try again.
    same => n,GotoIf($["${TOLD}" = ""]?nobridge)
    same => n,AudioSocket(${WA_UUID},${BRIDGE_AUDIOSOCKET})
    same => n,Hangup()
    same => n(nobridge),NoOp(the bridge did not take the call)
    same => n,Hangup(38)   ; network out of order

; ---- A call we place ourselves, to test the path without WhatsApp --------
;
; `channel originate Local/918040802529@sarvathra-test application Echo` walks
; the same dialplan a real WhatsApp call walks, so the whole chain — uuid,
; announce, AudioSocket, bridge, agent — can be proven before a live number is
; ever pointed at this box.
[sarvathra-test]
exten => _[+0-9].,1,NoOp(TEST call to ${EXTEN})
    same => n,Goto(from-whatsapp,${EXTEN},1)
