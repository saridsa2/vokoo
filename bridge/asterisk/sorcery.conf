; Which store each PJSIP object type comes from.
;
; Endpoints, auths and AORs are realtime — see extconfig.conf. Everything else
; stays in pjsip.conf: transports and the WhatsApp endpoint are infrastructure,
; changed by a deploy rather than by a person being onboarded, and belong in the
; repository where they can be read and reviewed.
[res_pjsip]
endpoint=realtime,ps_endpoints
auth=realtime,ps_auths
aor=realtime,ps_aors
