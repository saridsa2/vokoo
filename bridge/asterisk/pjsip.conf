; Sarvathra — SIP for WhatsApp Business Calling.
;
; Deployed to /etc/asterisk/pjsip.conf. Kept here so the configuration that
; answers the phone is in the repository rather than only on the box, which is
; the mistake this project already made once with the bridge's Cargo.toml.
;
; Meta sends the INVITE to us; we never register with them. It requires TLS,
; validates our certificate against the hostname it was configured with, and
; presents no client certificate of its own.

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/sip.crt
priv_key_file = /etc/asterisk/keys/sip.key
; Nothing legacy is behind this, so nothing older than 1.2 needs speaking.
method = tlsv1_2
; No mutual TLS: Meta presents no client certificate. Requiring one would fail
; every handshake, and it is documented behaviour rather than something to
; discover from a packet capture.
verify_client = no
verify_server = no
; No NAT in front of this box, but PJSIP still has to be told what to put in
; SDP.
external_media_address = 212.38.94.176
external_signaling_address = 212.38.94.176


; ---- WhatsApp Business Calling ------------------------------------------
;
; Meta's media is WebRTC in a SIP wrapper: ICE, DTLS-SRTP and Opus. So this is
; configured like a browser client, not like a SIP trunk — which is the thing
; most likely to be got wrong here. A trunk-shaped endpoint completes the
; handshake, answers the call, and carries no audio, which is exactly the
; failure other people report against this integration.

[whatsapp]
type = endpoint
context = from-whatsapp
transport = transport-tls
; Opus only. Meta offers nothing else, and leaving the rest enabled invites a
; negotiation ending in a codec Asterisk would transcode twice.
disallow = all
allow = opus

; --- media, as WebRTC does it ---
media_encryption = dtls
dtls_auto_generate_cert = yes
; Checked against the fingerprint carried in the SDP, which is how DTLS-SRTP
; proves the media peer is the one that signalled. Not "no".
dtls_verify = fingerprint
dtls_setup = actpass
ice_support = yes
rtcp_mux = yes
use_avpf = yes
; Answer to where the media actually came from rather than where the SDP says,
; which is what makes this work through Meta's relays.
media_use_received_transport = yes
force_rport = yes
rewrite_contact = yes
direct_media = no

[whatsapp]
type = aor
max_contacts = 0

; Meta signs its INVITEs from this domain and adds x-wa-meta-* headers.
;
; Their published IP list is the stronger check and belongs here too — it is
; documented as the same list as the Cloud API webhooks. Until that list is in
; hand this matches on the domain alone, which is worth knowing rather than
; assuming: a header is easier to forge than a source address.
[whatsapp]
type = identify
endpoint = whatsapp
; Two things wrong in the first version, both found on real calls rather than
; reasoned about, and the second is the one that matters:
;
; 1. It anchored `<sip:` straight after `From: `. The real header carries the
;    caller's display name first:
;
;        From: "Satya" <sip:+919949879837@wa.meta.vc>;tag=8c20a3f7-…
;
; 2. **`match_header` is an exact string comparison unless the value is wrapped
;    in slashes.** Without them nothing is a pattern, however much it looks like
;    one — so `From: .*@wa\.meta\.vc` was compared literally and matched
;    nothing. Both versions gave the caller 401 / "No matching endpoint found",
;    which they hear as ringing that is never answered.
match_header = From: /@wa\.meta\.vc/
;
; No `match` on an address. Three calls came from 173.252.82.73, 66.220.149.3
; and 66.220.149.32 — Meta rotates across their whole estate, so a list built
; from what we happened to see would be a check that silently stops matching.
; Their published range list belongs here when somebody has it in hand; until
; then the header is the honest single criterion, and it is worth knowing that
; a header is easier to forge than a source address.
