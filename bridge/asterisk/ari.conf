; ARI, so the bridge can drive Asterisk as a switch: originate an AudioSocket
; leg for the AI, bridge it to the caller, and later swap that leg for a human.
;
; The user and its password live in an include kept off the repository, the
; same shape as the dialplan's BRIDGE_TOKEN:
;
;   /etc/asterisk/vokoo-ari-secret.conf:
;       [vokoo]
;       type = user
;       read_only = no
;       password = <the value of ARI_PASSWORD in bridge.env>
[general]
enabled = yes
pretty = no

#include "vokoo-ari-secret.conf"
