; Where Asterisk looks up configuration that is not in a file.
;
; The bridge is the backend. Asterisk has no res_config_pgsql and no
; res_config_odbc — only curl, ldap and sqlite3 — and the Supabase container
; publishes no port on the host, so there is nothing for a database driver to
; connect to. res_config_curl fits exactly: Asterisk POSTs, the bridge answers
; from the database it already reads.
;
; Provisioning an agent is therefore an INSERT into `agent_extensions`, with no
; file to write here and no `pjsip reload`.
;
; **Loopback, and that is the whole of the protection.** res_config_curl sends
; no credential and offers nowhere to put one, and the ps_auths answer contains
; SIP passwords in plaintext. Caddy publishes only /ws from this host, so
; reaching this means already being on the box.
; Each family gets its own URL, because Asterisk appends **only the operation**
; — a lookup arrives as `<url>/single`, with nothing saying which table it was
; for. Watched on the wire rather than assumed: a shared base URL produced
; `/asterisk/realtime/single` for all three families, which cannot be answered
; because the answer differs per family. The path is the only place the family
; can live.
[settings]
ps_endpoints => curl,http://127.0.0.1:8080/asterisk/realtime/ps_endpoints
ps_auths     => curl,http://127.0.0.1:8080/asterisk/realtime/ps_auths
ps_aors      => curl,http://127.0.0.1:8080/asterisk/realtime/ps_aors

; ps_contacts is deliberately absent. Contacts are written by Asterisk on every
; registration and expire in minutes; serving them would mean implementing
; store, update and destroy for something with no reason to outlive the process.
; Unmapped, Asterisk keeps them in memory, which is where they belong.
