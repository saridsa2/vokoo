[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellally-health-data-anonymizer"
version = "0.1.0"
description = "De-identification and anonymization toolkit for privacy-safe sharing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Satya Suman Saridae"}
]
keywords = ["health", "healthcare", "anonymization", "privacy", "de-identification", "medical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://www.wellally.tech/"
Documentation = "https://www.wellally.tech/blog"
Repository = "https://github.com/saridsa2/vokoo/tree/main/vendor/wellally-schemas"
"Bug Reports" = "https://github.com/saridsa2/vokoo/issues"

[tool.setuptools]
packages = ["wellally_health_data_anonymizer"]

[tool.setuptools.package-data]
wellally_health_data_anonymizer = ["py.typed"]
