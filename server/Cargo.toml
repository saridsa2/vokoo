[package]
name = "vokoo-controlplane"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
# The viewer's own day. "Today" reset at 05:30 local without it.
chrono-tz = "0.10"
dotenvy = "0.15.7"
hex = "0.4.3"
http = "1.3.1"
# Minting the short-lived token an API key acts with. The same JWT_SECRET
# PostgREST verifies against, so a key-authenticated request reaches RLS as a
# real member rather than bypassing it with the service role key.
jsonwebtoken = "9.3"
rand = "0.8"
sha2 = "0.10"
# Used only for the token-refresh call. supabase-lib-rs's refresh_session()
# reads a session held on the client, which this server does not keep — every
# request builds a fresh client, so there is nothing to refresh from.
# `stream` is for the dashboard: the bridge pushes Server-Sent Events and this
# process forwards them, so the response body has to be read as it arrives
# rather than awaited to completion — a stream that never ends cannot be.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
supabase = { package = "supabase-lib-rs", version = "0.5.3", default-features = false, features = ["auth", "database", "native"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.0", features = ["cors", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
